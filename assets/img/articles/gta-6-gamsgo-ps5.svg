<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GTA VI, PlayStation 5 et GamsGo</title>
  <desc id="desc">Illustration originale d'une ville côtière aux couleurs néon avec une route, une console stylisée et la date du 19 novembre 2026.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b46"/>
      <stop offset="0.48" stop-color="#5a2d78"/>
      <stop offset="1" stop-color="#ed6e75"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#ff7895"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a3a"/>
      <stop offset="1" stop-color="#07111a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#sky)"/>
  <circle cx="890" cy="215" r="132" fill="url(#sun)" opacity=".95" filter="url(#glow)"/>
  <g fill="#0b2537" opacity=".96">
