  <desc id="description">Illustration générique pour un bon plan dont la photo produit n'est pas disponible.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d40"/>
      <stop offset="1" stop-color="#176b73"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#f59e0b"/>
