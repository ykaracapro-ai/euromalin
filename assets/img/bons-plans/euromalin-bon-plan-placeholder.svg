  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#background)"/>
  <circle cx="1060" cy="90" r="230" fill="#47d0a8" opacity=".2"/>
  <circle cx="1120" cy="610" r="180" fill="none" stroke="#47d0a8" stroke-width="10" opacity=".7"/>
  <rect x="76" y="82" width="248" height="58" rx="29" fill="#47d0a8"/>
